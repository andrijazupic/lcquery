[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lcquery"
version = "1.2.0"
description = "Multi-survey time-domain light-curve queries on a unified BJD_TDB / AB-uJy schema"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Andrija Zupic" }]
dependencies = [
  "numpy>=1.26.0",   
  "pyarrow>=14.0.0",
  "pandas", "pyyaml", "requests",
  "astropy", "astroquery", "pyvo",
  "ztfquery", "lightkurve", "astro-datalab", 
  "skypatrol @ git+https://github.com/asas-sn/skypatrol.git"
]

[project.optional-dependencies]
blackgem = ["google-cloud-bigquery", "db-dtypes"]
cheops   = ["dace-query>=3.0"]
all      = ["google-cloud-bigquery", "dace-query>=3.0", "db-dtypes"]

[tool.setuptools.packages.find]
include = ["lcquery*"]
